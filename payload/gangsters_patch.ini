; Settings for the Gangsters Windows 11 patch (DSETUP.dll shim). Safe to edit; restart the game after changes.

[compat]
; Store the game's settings (HKLM\SOFTWARE\Hothouse\Gangsters) per user so the game does not need administrator rights.
registry_redirect=1
; Some PCs expose many audio mixers; report only the first one to the game. Normally not needed.
single_mixer=0

[display]
; Move and scale the game's native menu buttons to match the upscaled picture.
scale_child_windows=1
; Draw the menu button labels at full resolution (needs the bundled gangsters.exe.manifest).
render_button_labels=1

[debug]
; Everything below writes extra detail to gangsters_patch.log. Leave off unless troubleshooting.
trace_mci=0
trace_windows=0
trace_files=0
trace_mixer=0
trace_registry=0
dump_cd_object=0
; Play Music\N.mp3 a few seconds after launch (audio test).
autoplay_track=0
